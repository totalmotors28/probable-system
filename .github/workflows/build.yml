name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Flutter scaffold döretmek
        run: |
          flutter create --org com.example --project-name aydym_calar temp_project
          cp -r temp_project/android .
          cp -r temp_project/.metadata . || true
          cp temp_project/analysis_options.yaml . || true
          rm -rf temp_project

      - name: Rugsatnamalary goşmak
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application|' $MANIFEST

      - run: flutter clean
      - run: flutter pub get

      - name: Patch on_audio_query (namespace + JVM target)
        run: |
          FILE=$(find $HOME/.pub-cache -path "*on_audio_query_android*/android/build.gradle" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Faýl tapylmady!"
            exit 1
          fi
          echo "Патчим: $FILE"

          sed -i 's|android {|android {\n    namespace "com.lucasjosino.on_audio_query"|' "$FILE"
          sed -i 's|sourceCompatibility JavaVersion.VERSION_1_8|sourceCompatibility JavaVersion.VERSION_17|' "$FILE"
          sed -i 's|targetCompatibility JavaVersion.VERSION_1_8|targetCompatibility JavaVersion.VERSION_17|' "$FILE"

          if ! grep -q "compileOptions" "$FILE"; then
            sed -i 's|android {|android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }|' "$FILE"
          fi

          if ! grep -q "kotlinOptions" "$FILE"; then
            sed -i 's|android {|android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }|' "$FILE"
          fi

          echo "--- Итоговый файл ---"
          cat "$FILE"

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: aydym-calar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
