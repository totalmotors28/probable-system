name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Flutter scaffold döretmek
        run: |
          flutter create --org com.example --project-name aydym_calar temp_project
          cp -r temp_project/android .
          cp -r temp_project/.metadata . || true
          cp temp_project/analysis_options.yaml . || true
          rm -rf temp_project

      - name: Rugsatnamalary goşmak
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application|' $MANIFEST

      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: aydym-calar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
